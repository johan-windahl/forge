name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # Not yet blocking: the tree has pre-existing annotation errors that
      # predate CI. Drop `continue-on-error` once they are cleared.
      - name: Types
        run: mypy forge
        continue-on-error: true
